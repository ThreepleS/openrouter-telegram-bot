<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#1e3a5f" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>AI App — Админ</title>
  <style>
    :root { --bg: #0f1419; --panel: #1a2230; --accent: #1e3a5f; --text: #e6edf3; --muted: #8b98a5; --danger: #e06b6b; --ok: #6fcf7f; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 22px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .card { background: var(--panel); border-radius: 12px; padding: 12px 14px; }
    .card .n { font-size: 22px; font-weight: 700; }
    .card .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; font-size: 13px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #243042; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    .btns { display: flex; gap: 6px; flex-wrap: wrap; }
    button { border: 0; border-radius: 8px; padding: 7px 11px; background: var(--accent); color: #fff; cursor: pointer; font: inherit; }
    button.ghost { background: #2a3a4f; }
    button.danger { background: var(--danger); }
    button.sm { padding: 4px 8px; font-size: 12px; }
    input, select, textarea { padding: 8px 10px; border-radius: 8px; border: 1px solid #33415c; background: var(--bg); color: var(--text); font: inherit; }
    input[type=text], input[type=number] { width: 130px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .err { color: var(--danger); }
    .ok { color: var(--ok); }
    .key { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
    .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; background: #2a3a4f; margin-right: 4px; }
    .pill.adm { background: #7a5a1f; }
    .pill.perm { background: #2a6f4f; }
    .pill.temp { background: #6f5a2a; }
    #login { max-width: 420px; margin: 80px auto; background: var(--panel); padding: 24px; border-radius: 14px; text-align: center; }
    .muted { color: var(--muted); font-size: 12px; }
    a { color: #6fb6ff; }
  </style>
</head>
<body>
  <div id="login">
    <h1>🛠 Админ-панель</h1>
    <p class="muted">Вход выполняется автоматически с вашего устройства…</p>
    <p id="login_err" class="err"></p>
  </div>

  <div id="app" style="display:none">
    <h1>🛠 Админ-панель</h1>
    <div class="sub">Управление пользователями, ключами и доступом. <a href="/">← к чату</a></div>

    <h2>Сводка</h2>
    <div class="cards" id="summary"></div>

    <h2>Пользователи и сохранённые ключи</h2>
    <div class="row">
      <button onclick="loadAll()">🔄 Обновить</button>
    </div>
    <table id="users">
      <thead><tr>
        <th>ID</th><th>Пров.</th><th>Модель</th><th>Конт.</th><th>Сообщ.</th><th>Токены</th><th>Сохранённые ключи</th><th>Действия</th>
      </tr></thead>
      <tbody></tbody>
    </table>

    <h2>Белый список</h2>
    <div class="row">
      <input id="wl_id" type="text" placeholder="Telegram ID" />
      <select id="wl_type">
        <option value="permanent">♾️ вечный</option>
        <option value="temporary">⏳ временный</option>
      </select>
      <input id="wl_days" type="number" placeholder="дней" style="display:none" />
      <input id="wl_note" type="text" placeholder="пометка" />
      <button onclick="wlAdd()">➕ Добавить</button>
    </div>
    <table id="whitelist">
      <thead><tr><th>ID</th><th>Тип</th><th>Пометка</th><th>Действия</th></tr></thead>
      <tbody></tbody>
    </table>

    <h2>Опасная зона</h2>
    <div class="row">
      <button class="danger" onclick="resetAll()">🧹 Сбросить ВСЕХ пользователей</button>
    </div>
    <p id="msg" class="muted"></p>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    function resolveApiBase() {
      try {
        const fromUrl = new URLSearchParams(location.search).get("api");
        if (fromUrl) { localStorage.setItem("api_base", fromUrl); return fromUrl.replace(/\/+$/, ""); }
        const stored = localStorage.getItem("api_base");
        if (stored) return stored.replace(/\/+$/, "");
      } catch (e) {}
      return "";
    }
    const API_BASE = resolveApiBase();
    window.addEventListener("error", (e) => { try { alert("JS ошибка: " + (e.message || e.error || e)); } catch (_) {} });
    let initData = "";
    const inTelegram = !!(window.Telegram && window.Telegram.WebApp);
    if (inTelegram) { window.Telegram.WebApp.ready(); initData = window.Telegram.WebApp.initData || ""; }

    let currentAdminId = "";
    function authBody() {
      return inTelegram && initData ? { init_data: initData } : { user_id: currentAdminId };
    }
    function pjson(url, body) {
      const full = API_BASE + url;
      return fetch(full, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign(authBody(), body || {})) })
        .then((r) => r.json());
    }
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    async function doLogin(id) {
      currentAdminId = String(id);
      $("#login_err").textContent = "запрос к серверу…";
      let data;
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 12000);
        const res = await fetch(API_BASE + "/api/admin/summary", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(authBody()),
          signal: ctrl.signal,
        });
        clearTimeout(t);
        const text = await res.text();
        try { data = JSON.parse(text); }
        catch (_) {
          $("#login_err").textContent = "⚠️ Сервер вернул не-JSON (возможно туннель ngrok блокирует запрос). Откройте напрямую: http://127.0.0.1:8080/admin";
          return;
        }
      } catch (e) {
        $("#login_err").textContent = "⚠️ сетевая ошибка: " + String(e);
        return;
      }
      if (!data.ok) {
        $("#login_err").textContent = "⛔ " + (data.error || JSON.stringify(data));
        return;
      }
      $("#login").style.display = "none";
      $("#app").style.display = "block";
      loadAll();
    }

    async function boot() {
      if (inTelegram) {
        $("#login_err").textContent = "Telegram: проверяем initData… (initData " + (initData ? "есть" : "ПУСТОЙ") + ")";
        await doLogin("");
        return;
      }
      try {
        const res = await fetch(API_BASE + "/api/whoami", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
        const data = await res.json();
        if (data.ok && data.admin_id) { await doLogin(data.admin_id); return; }
      } catch (e) {
        $("#login_err").textContent = "⚠️ " + String(e);
        return;
      }
      $("#login_err").textContent = "⛔ Админ-доступ только локально или внутри Telegram. Через публичную ссылку (ngrok) вход недоступен.";
    }
    boot();

    async function loadAll() {
      const [s, u, w] = await Promise.all([
        pjson("/api/admin/summary", {}),
        pjson("/api/admin/users", {}),
        pjson("/api/admin/whitelist", { action: "list" }).catch(() => ({ ok: false })),
      ]);
      if (s.ok) renderSummary(s);
      if (u.ok) renderUsers(u.users);
      if (w.ok) renderWhitelist(w.whitelist);
    }

    function renderSummary(s) {
      const cards = [
        ["Пользователей", s.users_total],
        ["В белом списке", s.whitelisted],
        ["Всего сообщений", s.messages_total],
        ["Всего токенов", s.tokens_total],
      ];
      $("#summary").innerHTML = cards.map(([l, n]) => `<div class="card"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join("");
      const line = (title, arr) => `<div class="muted">${title}: ` +
        (arr && arr.length ? arr.map((e) => `${e.user_id} — ${e.message_count} сообщ., ${e.total_tokens} ток.`).join("; ") : "нет") + `</div>`;
      $("#summary").insertAdjacentHTML("beforeend", line("24ч", s.stats_24h) + line("7д", s.stats_7d));
    }

    function keysHtml(keys) {
      if (!keys) return "—";
      const order = ["openrouter", "openai", "gemini", "groq", "huggingface", "venice"];
      const entries = order.filter((p) => keys[p]).map((p) => [p, keys[p]])
        .concat(Object.entries(keys).filter(([p]) => !order.includes(p)));
      if (!entries.length) return "—";
      return entries.map(([prov, v]) =>
        `<span class="pill ${v && v.has ? "perm" : ""}">${esc(prov)} ${v && v.has ? "✅" : "—"}</span>`
      ).join("  ");
    }

    function renderUsers(users) {
      const tb = $("#users tbody");
      tb.innerHTML = users.map((u) => `
        <tr>
          <td>${u.is_admin ? '<span class="pill adm">админ</span>' : ""}${esc(u.user_id)}</td>
          <td>${esc(u.provider)}</td>
          <td>${esc(u.model) || "—"}</td>
          <td>${esc(u.context_limit)}</td>
          <td>${esc(u.message_count)}</td>
          <td>${esc(u.tokens_total)}</td>
          <td>${keysHtml(u.keys)}</td>
          <td><div class="btns">
            <button class="sm ghost" onclick="usrAction('clear',${u.user_id})">🗑 история</button>
            ${u.is_admin ? "" : `<button class="sm danger" onclick="usrAction('reset',${u.user_id})">♻ сброс</button>`}
          </div></td>
        </tr>`).join("");
    }

    async function usrAction(action, uid) {
      if (action === "reset" && !confirm(`Сбросить пользователя ${uid}?`)) return;
      const d = await pjson("/api/admin/user", { action, user_id: uid });
      flash(d.ok ? d.message : (d.error || "ошибка"));
      if (d.ok) loadAll();
    }

    function renderWhitelist(list) {
      const tb = $("#whitelist tbody");
      if (!list || !list.length) { tb.innerHTML = `<tr><td colspan="4" class="muted">список пуст</td></tr>`; return; }
      tb.innerHTML = list.map((e) => {
        const type = e.access_type === "temporary" ? `<span class="pill temp">⏳</span>` : `<span class="pill perm">♾️</span>`;
        return `<tr>
          <td>${e.user_id == ADMIN() ? '<span class="pill adm">админ</span>' : ""}${esc(e.user_id)}</td>
          <td>${type}</td>
          <td>${esc(e.note) || "—"}</td>
          <td><div class="btns">
            <button class="sm ghost" onclick="wlNote(${e.user_id})">✏️ пометка</button>
            ${e.user_id == ADMIN() ? "" : `<button class="sm danger" onclick="wlRemove(${e.user_id})">✕ удалить</button>`}
          </div></td>
        </tr>`;
      }).join("");
    }
    function ADMIN() { return Number(currentAdminId); }

    async function wlAdd() {
      const user_id = $("#wl_id").value.trim();
      const access_type = $("#wl_type").value;
      const days = access_type === "temporary" ? $("#wl_days").value : null;
      const note = $("#wl_note").value.trim();
      if (!user_id) { flash("введи ID", true); return; }
      const d = await pjson("/api/admin/whitelist", { action: "add", user_id, access_type, days, note });
      flash(d.ok ? "добавлено" : (d.error || "ошибка"));
      if (d.ok) { $("#wl_id").value = ""; $("#wl_note").value = ""; loadAll(); }
    }
    async function wlRemove(uid) {
      if (!confirm(`Удалить ${uid} из белого списка?`)) return;
      const d = await pjson("/api/admin/whitelist", { action: "remove", user_id: uid });
      flash(d.ok ? d.message : (d.error || "ошибка"));
      if (d.ok) loadAll();
    }
    async function wlNote(uid) {
      const note = prompt("Новая пометка:");
      if (note === null) return;
      const d = await pjson("/api/admin/whitelist", { action: "note", user_id: uid, note });
      flash(d.ok ? "сохранено" : (d.error || "ошибка"));
      if (d.ok) loadAll();
    }
    async function resetAll() {
      if (!confirm("Сбросить ВСЕХ пользователей? Белый список сохранится.")) return;
      const d = await pjson("/api/admin/reset-all", {});
      flash(d.ok ? d.message : (d.error || "ошибка"));
      if (d.ok) loadAll();
    }

    $("#wl_type").addEventListener("change", (e) => { $("#wl_days").style.display = e.target.value === "temporary" ? "inline" : "none"; });

    function flash(t, isErr) {
      const m = $("#msg"); m.textContent = t; m.className = isErr ? "err" : "ok";
      setTimeout(() => { m.textContent = ""; }, 2500);
    }
  </script>
</body>
</html>
